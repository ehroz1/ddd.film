<style>
/* Layout: one-screen dark app, stacked deck like the reference, actions pinned at bottom */
:root{--bg:#050506;--surf:#141417;--line:#26262b;--fg:#f4f4f6;--mut:#9a9aa3;--yes:#c6f135;--maybe:#ffb23e;--no:#ff4d5e;--disp:'Unbounded',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg) radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/12px 12px;color:var(--fg);font-family:var(--body);overflow:hidden}

.deck{position:relative;flex:1;min-height:0;margin-top:22px}
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:var(--surf);box-shadow:0 -6px 24px rgba(0,0,0,.6);touch-action:none;user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;will-change:transform;display:flex;flex-direction:column}

.pst .bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(22px) brightness(.45);pointer-events:none}
.pst .fg{position:relative;display:block;height:100%;width:100%;object-fit:contain;pointer-events:none}
.info{flex:none;padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surf);max-height:44%;overflow:auto}
.genre{font:600 11px var(--disp);text-transform:uppercase;letter-spacing:.08em;color:var(--yes)}
.info h2{font:800 19px/1.15 var(--disp);margin:0;text-wrap:balance}
.info p{margin:0;font-size:13.5px;line-height:1.45;color:#cfcfd6}

</style>

  [f.yt[0],f.en].filter(Boolean).forEach(id=>{for(const n of[1,2,3])a.push({th:[yt(id,'mq',n),yt(id,'hq',n)],big:[yt(id,'maxres',n),yt(id,'sd',n),yt(id,'hq',n)]})});
  return a;
}
const STILLS=F.map(stills);
function chainAttr(list){return `src="${list[0]}" data-chain='${JSON.stringify(list)}' data-n="0" onload="ok(this)" onerror="bad(this)"`}
function bad(im){const c=JSON.parse(im.dataset.chain),n=+im.dataset.n+1;if(n<c.length){im.dataset.n=n;im.src=c[n]}else{im.dataset.dead=1;im.dispatchEvent(new Event('dead'))}}
function ok(im){if(/ytimg/.test(im.src)&&im.naturalWidth<=120)return bad(im);if(im.dataset.wide&&im.naturalHeight>=im.naturalWidth){im.dataset.dead=1;im.dispatchEvent(new Event('dead'))}}

/* прогресс сохраняется между визитами (если хранилище доступно) */
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.votes)&&s.n===F.length){votes=s.votes.slice(0,F.length);i=votes.length}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({n:F.length,votes}))}catch(e){}}

function deck(){
  busy=false;
  app.innerHTML=`<header><h1>Киносвайп</h1><div class="tools"><span class="count">${String(Math.min(i+1,F.length)).padStart(2,'0')} / ${F.length}</span><button class="undo" id="undo" aria-label="Вернуть предыдущий фильм" title="Назад (Backspace)" ${i?'':'disabled'}>↶</button></div></header>
  <div class="prog" aria-hidden="true"><i style="width:${i/F.length*100}%"></i></div>
  <div class="deck" id="deck"></div>
  <div class="bar"><button class="b-no" data-v="no">✕ Нет</button><button class="b-may" data-v="may">Может быть</button><button class="b-yes" data-v="yes">♥ Интересно</button></div>
  <div class="hint">Свайп → интересно · ← нет · ↑ может быть</div>`;
  const d=document.getElementById('deck');
  for(let k=Math.min(i+2,F.length-1);k>=i;k--){
    const f=F[k],o=k-i,c=document.createElement('div');c.className='card';
    c.style.transform=`translateY(${-o*14}px) scale(${1-o*.05})`;
    if(o)c.setAttribute('aria-hidden','true');
    const st=STILLS[k].map((s,n)=>`<button data-still="${n}" aria-label="Кадр ${n+1}" ${o?'tabindex="-1"':''}><img ${chainAttr(s.th)} ${s.wide?'data-wide="1"':''} alt="" loading="lazy" draggable="false"></button>`).join('');
    c.innerHTML=`<div class="pst"><img class="bg" ${chainAttr(POSTERS[k])} alt="" draggable="false"><img class="fg" ${chainAttr(POSTERS[k])} alt="Постер: ${f.t}" draggable="false">
    <span class="stamp s-yes">Интересно</span><span class="stamp s-no">Нет</span><span class="stamp s-may">Может быть</span>
    <button class="trl" data-trl="${k}" ${o?'tabindex="-1"':''}>▶ Трейлер</button></div>
    <div class="info"><span class="genre">${f.g} · ${f.age}</span><h2>${f.t}</h2><span class="meta">${f.c} · ${f.dt}</span><div class="stills">${st}</div><p>${f.d}</p></div>`;
    /* кадр, который не загрузился ни из одного источника, убираем из ленты */
    c.querySelectorAll('.stills img').forEach(im=>{const rm=()=>im.parentNode.remove();if(im.dataset.dead)rm();else im.addEventListener('dead',rm)});
    c.querySelector('.stills').onclick=e=>{const b=e.target.closest('[data-still]');if(b)gallery(k,+b.dataset.still)};
    d.appendChild(c); if(o===0) drag(c);
  }
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>vote(b.dataset.v));
  app.querySelectorAll('[data-trl]').forEach(b=>{b.onpointerdown=e=>e.stopPropagation();b.onclick=()=>trailer(+b.dataset.trl)});
  document.getElementById('undo').onclick=undo;
}
function drag(c){
  let sx,sy,dx=0,dy=0,on=false;const st=t=>c.querySelector('.s-'+t);
  const info=c.querySelector('.info'),strip=c.querySelector('.stills');
  c.onpointerdown=e=>{if(busy||e.button>0)return;on=true;sx=e.clientX;sy=e.clientY;c.style.transition='none';c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!on)return;dx=e.clientX-sx;dy=e.clientY-sy;
    c.style.transform=`translate(${dx}px,${Math.min(dy,40)}px) rotate(${dx/18}deg)`;
    st('yes').style.opacity=Math.max(0,dx/100);st('no').style.opacity=Math.max(0,-dx/100);st('may').style.opacity=Math.max(0,-dy/100-Math.abs(dx)/150)};
  c.onpointerup=c.onpointercancel=e=>{if(!on)return;on=false;c.style.transition='';
    if(e.type==='pointerup'&&dx>100)vote('yes');else if(e.type==='pointerup'&&dx<-100)vote('no');else if(e.type==='pointerup'&&dy<-100&&Math.abs(dx)<100)vote('may');
    else{c.style.transform='';c.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}dx=dy=0};
  /* прокрутка описания и ленты кадров не должна сдвигать карточку */
  info.style.touchAction='pan-y';info.onpointerdown=e=>{if(info.scrollHeight>info.clientHeight)e.stopPropagation()};
  strip.onpointerdown=e=>e.stopPropagation();
}
function vote(v){
  if(busy||i>=F.length)return;busy=true;
  const c=document.querySelector('.deck .card:last-child');
  if(c){c.querySelector('.s-'+v).style.opacity=1;c.style.transform=v==='yes'?'translateX(130%) rotate(18deg)':v==='no'?'translateX(-130%) rotate(-18deg)':'translateY(-120%)';c.style.opacity=0}
  votes[i]=v;i++;votes.length=i;save();
  setTimeout(()=>i<F.length?deck():result(),260);
}
function undo(){if(busy||!i)return;i--;votes.length=i;save();deck()}

function openModal(html){lastFocus=document.activeElement;mbox.innerHTML=html;modal.hidden=false;const cl=document.getElementById('cl');cl.onclick=closeModal;cl.focus()}
function closeModal(){modal.hidden=true;mbox.innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
modal.onclick=e=>{if(e.target===modal)closeModal()};

/* трейлер: несколько русских версий — если одна не встраивается, можно переключить */
function trailer(k,n=0){
  const f=F[k],id=f.yt[n];
  const sw=f.yt.length>1?`<div class="tsw">${f.yt.map((_,m)=>`<button data-t="${m}" aria-pressed="${m===n}">Трейлер ${m+1}</button>`).join('')}</div>`:'';
  const q=encodeURIComponent(f.t+' трейлер на русском');
  openModal(`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&hl=ru" title="Трейлер: ${f.t}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>${sw}
  <div class="mf"><div class="links"><b style="font-size:14px">${f.t}</b><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Не грузится? Открыть на YouTube ↗</a><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Другие русские трейлеры ↗</a></div><button class="x" id="cl">Закрыть</button></div>`);
  mbox.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>trailer(k,+b.dataset.t));
}

/* просмотр кадров во весь экран */
function gallery(k,start){
  const card=document.querySelector('.deck .card:last-child');
  const live=[...card.querySelectorAll('.stills [data-still]')].map(b=>+b.dataset.still);
  let p=Math.max(0,live.indexOf(start));lastFocus=document.activeElement;
  const show=()=>{const s=STILLS[k][live[p]];
    lb.innerHTML=`<img ${chainAttr(s.big)} alt="Кадр из фильма «${F[k].t}»"><button class="nav prev" aria-label="Предыдущий кадр">‹</button><button class="nav next" aria-label="Следующий кадр">›</button>
    <div class="lbf"><span>${F[k].t} · ${p+1} / ${live.length}</span><button class="x" id="lbx">Закрыть</button></div>`;
    lb.querySelector('.prev').onclick=()=>go(-1);lb.querySelector('.next').onclick=()=>go(1);
    lb.querySelector('#lbx').onclick=closeLb;lb.querySelector('#lbx').focus()};
  const go=d=>{p=(p+d+live.length)%live.length;show()};
  let sx=null;
  lb.onpointerdown=e=>{sx=e.clientX};
  lb.onpointerup=e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)go(dx<0?1:-1)};
  lb.onclick=e=>{if(e.target===lb)closeLb()};
  lb.go=go;lb.hidden=false;show();
}
function closeLb(){lb.hidden=true;lb.innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(!lb.hidden){if(e.key==='Escape')closeLb();else if(e.key==='ArrowRight')lb.go(1);else if(e.key==='ArrowLeft')lb.go(-1);return}
  if(!modal.hidden){if(e.key==='Escape')closeModal();return}
  if(i>=F.length||!document.getElementById('deck'))return;
  const v={ArrowRight:'yes',ArrowLeft:'no',ArrowUp:'may'}[e.key];
  if(v){e.preventDefault();vote(v)}else if(e.key==='Backspace'){e.preventDefault();undo()}
});

function result(){
  busy=false;
  const by=v=>F.map((f,k)=>k).filter(k=>votes[k]===v);
  const grp=(v,cls)=>{const a=by(v);return a.length?`<div class="grp ${cls}"><h3><span>${LBL[v]}</span><span>${a.length}</span></h3>${a.map(k=>`<div class="row"><img ${chainAttr(POSTERS[k])} alt=""><div><b>${F[k].t}</b><span>${F[k].g} · ${F[k].dt}</span></div></div>`).join('')}</div>`:''};
  app.innerHTML=`<header><h1>Мой выбор</h1><span class="count">${by('yes').length} ♥</span></header>
  <div class="res"><div id="shot">${grp('yes','g-yes')}${grp('may','g-may')}${grp('no','g-no')}<div class="brand">КИНОСВАЙП · ОКТЯБРЬ 2026</div></div>
  <div class="acts"><button class="tg" id="share">Поделиться в Telegram</button><button class="again" id="back">↶ Изменить последний ответ</button><button class="again" id="again">Пройти заново</button></div></div>`;
  document.getElementById('again').onclick=()=>{i=0;votes=[];save();deck()};
  document.getElementById('back').onclick=undo;
  document.getElementById('share').onclick=share;
}

/* Картинка для шеринга рисуется прямо на canvas в 1080 px по ширине —
   так она получается чёткой. Постеры берутся локальные (свой домен, без CORS-ограничений). */
const loadImg=u=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=u});
function rr(x,c,y,w,h,r){x.beginPath();x.roundRect?x.roundRect(c,y,w,h,r):x.rect(c,y,w,h)}
function lines(x,text,max,n){const w=text.split(' '),out=[];let s='';for(const t of w){const z=s?s+' '+t:t;if(x.measureText(z).width>max&&s){out.push(s);s=t}else s=z}out.push(s);if(out.length>n){out.length=n;let l=out[n-1];while(x.measureText(l+'…').width>max&&l.length)l=l.slice(0,-1);out[n-1]=l+'…'}return out}
async function drawShare(){
  try{await document.fonts.ready}catch(e){}
  const W=1080,P=64,G={yes:{bg:'#c6f135',fg:'#111',sub:'#333',h:210,ph:180},may:{bg:'#ffb23e',fg:'#111',sub:'#333',h:210,ph:180},no:{bg:'#141417',fg:'#f4f4f6',sub:'#9a9aa3',h:120,ph:96}};
  const groups=['yes','may','no'].map(v=>({v,ks:F.map((f,k)=>k).filter(k=>votes[k]===v)})).filter(g=>g.ks.length);
  let H=P+90+40;groups.forEach(g=>{H+=70+g.ks.length*(G[g.v].h+14)+24});H+=90;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#050506';x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.06)';for(let a=12;a<W;a+=24)for(let b=12;b<H;b+=24)x.fillRect(a,b,2,2);
  const imgs=await Promise.all(F.map(f=>loadImg(f.emb)));
  let y=P;x.fillStyle='#f4f4f6';x.font="800 64px Unbounded, system-ui, sans-serif";x.textBaseline='top';x.fillText('Мой кино-выбор',P,y);
  y+=90;x.fillStyle='#9a9aa3';x.font="600 28px Manrope, system-ui, sans-serif";x.fillText('Что посмотреть в кино · октябрь 2026',P,y);y+=40+20;
  for(const g of groups){const s=G[g.v];
    x.font="800 30px Unbounded, system-ui, sans-serif";x.fillStyle=g.v==='no'?'#9a9aa3':s.bg;x.fillText(LBL[g.v].toUpperCase(),P,y+14);
    x.textAlign='right';x.fillText(String(g.ks.length),W-P,y+14);x.textAlign='left';y+=70;
    for(const k of g.ks){rr(x,P,y,W-2*P,s.h,28);x.fillStyle=s.bg;x.fill();
      const pw=Math.round(s.ph*.69),py=y+(s.h-s.ph)/2,im=imgs[k];
      x.save();rr(x,P+16,py,pw,s.ph,16);x.clip();
      if(im){if(g.v==='no')x.globalAlpha=.45;const r=Math.max(pw/im.width,s.ph/im.height),iw=im.width*r,ih=im.height*r;x.drawImage(im,P+16+(pw-iw)/2,py+(s.ph-ih)/2,iw,ih)}else{x.fillStyle='#26262b';x.fill()}
      x.restore();
      const tx=P+16+pw+28,tw=W-P-tx-24;
      x.fillStyle=s.fg;x.font=`700 ${g.v==='no'?34:40}px Manrope, system-ui, sans-serif`;
      const ls=lines(x,F[k].t,tw,g.v==='no'?1:2),lh=g.v==='no'?40:48;
      const blockH=ls.length*lh+(g.v==='no'?0:40);let ty=y+(s.h-blockH)/2;
      ls.forEach(l=>{x.fillText(l,tx,ty);ty+=lh});
      if(g.v!=='no'){x.fillStyle=s.sub;x.font="600 28px Manrope, system-ui, sans-serif";x.fillText(lines(x,`${F[k].g} · ${F[k].dt}`,tw,1)[0],tx,ty+6)}
      y+=s.h+14}
    y+=24}
  x.fillStyle='#9a9aa3';x.font="600 24px Unbounded, system-ui, sans-serif";x.textAlign='center';
  x.fillText('КИНОСВАЙП'+(location.host?' · '+location.host+location.pathname.replace(/\/$/,''):''),W/2,H-P-10);
  return cv;
}
async function share(){
  const btn=document.getElementById('share');if(btn.disabled)return;btn.disabled=true;btn.textContent='Готовлю картинку…';
  const list=v=>F.filter((f,k)=>votes[k]===v).map(f=>'• '+f.t).join('\n');
  const text=`🎬 Мой кино-выбор\n\nИнтересно:\n${list('yes')||'—'}\n\nМожет быть:\n${list('may')||'—'}`;
  const page=location.href.startsWith('http')?location.origin+location.pathname:'';
  let blob=null,url='';
  try{const cv=await drawShare();blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(blob)url=URL.createObjectURL(blob)}catch(e){}
  btn.disabled=false;btn.textContent='Поделиться в Telegram';
  if(blob&&navigator.canShare){const file=new File([blob],'kinoswipe.png',{type:'image/png'});
    try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],text:page?text+'\n\n'+page:text});return}}catch(e){if(e.name==='AbortError')return}}
  const tg='https://t.me/share/url?url='+encodeURIComponent(page)+'&text='+encodeURIComponent(text);
  openModal(`<div style="padding:16px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto" id="preview">${url?`<img src="${url}" alt="Картинка с результатом"><a href="${url}" download="kinoswipe.png" style="font-size:13px;text-align:center">Скачать картинку</a><span style="font-size:13px;color:var(--mut)">На телефоне можно зажать картинку, чтобы сохранить её и прикрепить в Telegram</span>`:''}
  <a class="tg" style="height:52px;border-radius:99px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;flex:none" href="${tg}" target="_blank" rel="noopener">Открыть Telegram со списком ↗</a><button class="x" id="cl">Закрыть</button></div>`);
}
load();
i<F.length?deck():result();
</script>
